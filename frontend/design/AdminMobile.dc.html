<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap">
  <style>
    :root {
      --bg: oklch(19% 0.008 260); --surface: oklch(24% 0.009 260); --border: oklch(33% 0.012 260);
      --text: oklch(94% 0.004 260); --text-muted: oklch(66% 0.01 260); --text-faint: oklch(50% 0.01 260);
      --accent: oklch(64% 0.18 265); --accent-soft: oklch(28% 0.06 265);
      --active: oklch(66% 0.14 165); --active-soft: oklch(26% 0.05 165);
      --disabled: oklch(62% 0 0); --disabled-soft: oklch(30% 0 0);
      --danger: oklch(66% 0.18 25); --danger-soft: oklch(30% 0.06 25);
      --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
      --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.35);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Public Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    button { font: inherit; cursor: pointer; }
    .btn { padding: 0.55rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-weight: 600; font-size: 0.8rem; }
    .btn-danger { color: var(--danger); border-color: var(--danger-soft); display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; }
    .badge { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.2rem 0.55rem; border-radius: 999px; }
    .badge-admin { background: var(--accent-soft); color: var(--accent); }
    .badge-user { background: var(--disabled-soft); color: var(--text-muted); }
    .badge-active { background: var(--active-soft); color: var(--active); }
    .badge-disabled { background: var(--disabled-soft); color: var(--disabled); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
    .tag { font-size: 0.7rem; font-weight: 500; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 0.15rem 0.55rem; }
  </style>
</helmet>

<div style="min-height: 100%; background: var(--bg); padding-bottom: 32px;">
  <header style="display: flex; align-items: center; gap: 0.5rem; padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); background: var(--surface);">
    <span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="12" width="4" height="9" rx="1" fill="currentColor"/><rect x="10" y="7" width="4" height="14" rx="1" fill="currentColor"/><rect x="17" y="3" width="4" height="18" rx="1" fill="currentColor"/></svg>
    </span>
    <span style="font-weight: 800; font-size: 0.95rem;">Stock Alerts</span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin-left: 0.35rem;"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </header>

  <main style="padding: 1.1rem; display: flex; flex-direction: column; gap: 1rem;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 1rem; font-weight: 700;">Users</h2>
      <span class="tag">6 users</span>
    </div>

    <button class="btn" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
      Invite
    </button>

    <div class="card" style="padding: 0.9rem; display: flex; flex-direction: column; gap: 0.6rem;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-weight: 600; font-size: 0.88rem;">admin@example.com</span>
        <span class="badge badge-admin">Admin</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted);">
        <span><span class="mono">4</span> alarms</span>
        <span class="badge badge-active">Active</span>
      </div>
      <div style="display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: var(--text-faint);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Default admin
      </div>
    </div>

    <div class="card" style="padding: 0.9rem; display: flex; flex-direction: column; gap: 0.6rem;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-weight: 600; font-size: 0.88rem;">sofia@example.com</span>
        <span class="badge badge-admin">Admin</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted);">
        <span><span class="mono">2</span> alarms</span>
        <span class="badge badge-active">Active</span>
      </div>
      <div style="font-size: 0.75rem; color: var(--text-faint);">This is you</div>
    </div>

    <div class="card" style="padding: 0.9rem; display: flex; flex-direction: column; gap: 0.7rem;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-weight: 600; font-size: 0.88rem;">facundo@example.com</span>
        <span class="badge badge-admin">Admin</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted);">
        <span><span class="mono">12</span> alarms</span>
        <span class="badge badge-active">Active</span>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn" style="flex: 1;">Disable</button>
        <button class="btn btn-danger" style="flex: 1;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Delete
        </button>
      </div>
    </div>

    <div class="card" style="padding: 0.9rem; display: flex; flex-direction: column; gap: 0.7rem; opacity: 0.65;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-weight: 600; font-size: 0.88rem;">old-user@example.com</span>
        <span class="badge badge-user">User</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted);">
        <span><span class="mono">0</span> alarms</span>
        <span class="badge badge-disabled">Disabled</span>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn" style="flex: 1;">Enable</button>
        <button class="btn btn-danger" style="flex: 1;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Delete
        </button>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
